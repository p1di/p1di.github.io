<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #171717;
      color: #ececec;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Control Bar */
    header.ai-topbar {
      height: 56px;
      background-color: #212121;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
      user-select: none;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Floating Transparent Back Arrow Overlay */
    .p1di-back-overlay {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      color: #dedede;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.18s ease;
      cursor: pointer;
    }

    .p1di-back-overlay:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Model Selector Pills */
    .provider-selector {
      display: flex;
      background: #171717;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 4px;
    }

    .provider-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .provider-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
    }

    .provider-btn.active {
      background: #2f2f2f;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .provider-btn .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      opacity: 0.85;
    }

    .provider-btn.pdai.active .tag {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .provider-btn.duck.active .tag {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .external-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #9b9b9b;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.18s ease;
    }

    .external-link-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
    }

    /* Main Iframe Area */
    .iframe-container {
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
      background: #171717;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #171717;
    }

    .iframe-loader {
      position: absolute;
      inset: 0;
      background: #171717;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .iframe-loader.hidden {
      opacity: 0;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-size: 13px;
      color: #8e8e93;
    }

    @media (max-width: 600px) {
      header.ai-topbar {
        padding: 0 10px;
      }

      .brand-title span {
        display: none;
      }

      .provider-btn {
        padding: 5px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="ai-topbar">
    <div class="topbar-left">
      <a href="../../" class="p1di-back-overlay" title="Back to p1di Hub">
        &larr; Apps
      </a>
      <div class="brand-title">
        <span>ChatGPT</span>
        <span class="brand-badge" id="activeProviderBadge"></span>
      </div>
    </div>

    <div class="provider-selector">
      <button class="provider-btn pdai active" id="btnPdai" onclick="switchProvider('pdai')">
        <span>pdai</span>
        <span class="tag">⚡ Fast</span>
      </button>
      <button class="provider-btn duck" id="btnDuck" onclick="switchProvider('duck')">
        <span>duck.ai</span>
        <span class="tag">🧠 Pro</span>
      </button>
    </div>

    <div class="topbar-right">
      <a id="externalLink" href="https://redretep.github.io/ai/" target="_blank" class="external-link-btn"
        title="Open in new tab">
        <span>new tab</span> &nearr;
      </a>
    </div>
  </header>

  <div class="iframe-container">
    <div id="loader" class="iframe-loader">
      <div class="spinner"></div>
      <div class="loader-text" id="loaderText">Loading pdai...</div>
    </div>
    <iframe id="aiFrame" src="https://redretep.github.io/ai/" allow="microphone; clipboard-write; autoplay"></iframe>
  </div>

  <script>
    const PROVIDERS = {
      pdai: {
        name: 'pdai',
        label: 'pdai (Faster, Private)',
        badge: '⚡ Fast',
        url: 'https://redretep.github.io/ai/',
        loaderMsg: 'Connecting to pdai...'
      },
      duck: {
        name: 'duck.ai',
        label: 'duck.ai (Pro Models, Files)',
        badge: '🧠 Pro',
        url: 'https://duck.ai',
        loaderMsg: 'Connecting to duck.ai...'
      }
    };

    const aiFrame = document.getElementById('aiFrame');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loaderText');
    const btnPdai = document.getElementById('btnPdai');
    const btnDuck = document.getElementById('btnDuck');
    const badge = document.getElementById('activeProviderBadge');
    const externalLink = document.getElementById('externalLink');

    function switchProvider(key) {
      const config = PROVIDERS[key] || PROVIDERS.pdai;

      // Save user choice
      localStorage.setItem('p1di_chatgpt_provider', key);

      // Update Buttons UI
      if (key === 'pdai') {
        btnPdai.classList.add('active');
        btnDuck.classList.remove('active');
        badge.textContent = 'pdai';
      } else {
        btnDuck.classList.add('active');
        btnPdai.classList.remove('active');
        badge.textContent = 'duck.ai';
      }

      // Update External Link
      externalLink.href = config.url;

      // Update Loader
      loader.classList.remove('hidden');
      loaderText.textContent = config.loaderMsg;

      // Update Frame URL
      if (aiFrame.src !== config.url) {
        aiFrame.src = config.url;
      }
    }

    aiFrame.onload = () => {
      setTimeout(() => {
        loader.classList.add('hidden');
      }, 300);
    };

    // Load saved provider or default to pdai
    const savedProvider = localStorage.getItem('p1di_chatgpt_provider') || 'pdai';
    switchProvider(savedProvider);
  </script>
</body>

</html>
