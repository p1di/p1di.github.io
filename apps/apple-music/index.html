<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music — p1di</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }

    /* Floating Transparent Back Arrow Overlay */
    .p1di-back-overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
    }

    .p1di-back-overlay:hover {
      background: rgba(35, 35, 42, 0.85);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
      transform: scale(1.05) translateX(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .p1di-back-arrow {
      font-size: 15px;
      line-height: 1;
    }

    /* Warning Banner */
    .warning-banner {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: rgba(30, 30, 35, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 193, 7, 0.4);
      color: #ffca28;
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }

    .warning-banner.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-20px);
      pointer-events: none;
    }

    .dismiss-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      margin-left: 6px;
      opacity: 0.7;
    }

    .dismiss-btn:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <a href="../../" class="p1di-back-overlay" title="Back to p1di Hub">
    <span class="p1di-back-arrow">&larr;</span>
    <span>Apps</span>
  </a>

  <!-- Site Redirect Warning Banner -->
  <div id="warningBanner" class="warning-banner">
    <span>⚠️ site could be unstable</span>
    <button class="dismiss-btn" onclick="dismissWarning()">&times;</button>
  </div>

  <iframe src="https://music.octavestreaming.com" allowfullscreen></iframe>

  <script>
    function dismissWarning() {
      document.getElementById('warningBanner').classList.add('hidden');
    }

    // Auto-dismiss warning after 6 seconds
    setTimeout(() => {
      dismissWarning();
    }, 6000);
  </script>
</body>

</html>
