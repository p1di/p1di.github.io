<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Google Sans', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0e;
      color: #ededed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    p.subtitle {
      color: #88888e;
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Search */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      background: #141416;
      border: 1px solid #242428;
      border-radius: 10px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-input::placeholder {
      color: #55555c;
    }

    .search-input:focus {
      border-color: #44444c;
      background: #18181b;
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      stroke: #55555c;
      pointer-events: none;
    }

    /* Apps Grid */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.25rem 1rem;
      background: #141416;
      border: 1px solid #222226;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
      cursor: pointer;
      position: relative;
    }

    .app-card:hover {
      transform: translateY(-2px);
      background: #18181c;
      border-color: #33333a;
    }

    .app-card:active {
      transform: translateY(0);
    }

    /* Info Button at Top Corner */
    .info-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #88888e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 5;
    }

    .info-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: scale(1.1);
    }

    .info-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
    }

    .icon-container {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      background: #1c1c20;
      border: 1px solid #2a2a30;
      overflow: hidden;
    }

    .icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fallback-badge {
      font-size: 1.35rem;
      font-weight: 600;
      color: #d1d1d6;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #222228;
      text-transform: uppercase;
    }

    .app-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f4f4f5;
      text-transform: capitalize;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2.5rem 1rem;
      color: #66666e;
      font-size: 0.9rem;
      display: none;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #141417;
      border: 1px solid #28282e;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transform: translateY(10px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .modal-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #2a2a30;
      background: #1c1c20;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      text-transform: capitalize;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #77777e;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .modal-close:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.08);
    }

    .modal-body {
      font-size: 0.9rem;
      color: #b0b0b8;
      line-height: 1.6;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .modal-body h1, .modal-body h2, .modal-body h3 {
      color: #ffffff;
      font-size: 1rem;
      margin-top: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .modal-body h1:first-child, .modal-body h2:first-child {
      margin-top: 0;
    }

    .modal-body ul {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
    }

    .modal-body p {
      margin-bottom: 0.75rem;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px solid #222226;
    }

    .launch-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .launch-btn:hover {
      background: #3f3f46;
      border-color: #52525b;
    }

    @media (max-width: 480px) {
      body {
        padding: 2.5rem 1rem;
      }
      .apps-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Apps</h1>
      <p class="subtitle">Select an application to open.</p>
    </header>

    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search apps or tags..." autocomplete="off" />
    </div>

    <main class="apps-grid" id="appsGrid">
      <!-- Cards rendered here -->
    </main>

    <div id="emptyState" class="empty-state">
      No apps match your search.
    </div>
  </div>

  <!-- Info Modal -->
  <div id="infoModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <img id="modalIcon" class="modal-icon" src="" alt="" />
          <span id="modalTitle" class="modal-title">App Info</span>
        </div>
        <button id="closeModalBtn" class="modal-close">&times;</button>
      </div>
      <div id="modalBody" class="modal-body">
        Loading info...
      </div>
      <div class="modal-footer">
        <a id="modalLaunchBtn" class="launch-btn" href="#" target="_self">
          Launch App &rarr;
        </a>
      </div>
    </div>
  </div>

  <script>
    const defaultApps = [
      { 
        name: 'startpage', 
        title: 'Startpage',
        tags: ['startpage', 'home', 'dashboard', 'bookmark', 'search', 'links', 'start', 'browser', 'homepage', 'quicklinks', 'navigation', 'minimalist'] 
      },
      { 
        name: 'netflix', 
        title: 'Netflix',
        tags: ['netflix', 'streaming', 'movies', 'tv shows', 'cinema', 'video', 'player', 'entertainment', 'watch', 'media', 'series', 'film', 'trailers'] 
      },
      {
        name: 'spotify',
        title: 'Spotify',
        tags: ['spotify', 'music', 'player', 'streaming', 'audio', 'songs', 'playlists', 'podcasts', 'tracks', 'albums', 'artist', 'sound']
      }
    ];

    const appsGrid = document.getElementById('appsGrid');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('emptyState');
    const infoModal = document.getElementById('infoModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalIcon = document.getElementById('modalIcon');
    const modalBody = document.getElementById('modalBody');
    const modalLaunchBtn = document.getElementById('modalLaunchBtn');

    let loadedApps = [...defaultApps];

    // Load tags.txt for an app
    async function loadAppTags(appName) {
      try {
        const res = await fetch(`apps/${appName}/tags.txt`);
        if (res.ok) {
          const text = await res.text();
          return text.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
        }
      } catch (e) {}
      return null;
    }

    // Load readme.md for an app
    async function loadAppReadme(appName) {
      const candidates = [`apps/${appName}/readme.md`, `apps/${appName}/README.md` ];
      for (let path of candidates) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            return await res.text();
          }
        } catch (e) {}
      }
      return null;
    }

    // Basic Markdown to HTML converter
    function parseMarkdown(md) {
      if (!md) return '<p>No additional information available for this app.</p>';
      
      let html = md
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^\- (.*$)/gim, '<li>$1</li>')
        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>');

      // Wrap <li> elements into <ul>
      html = html.replace(/(<li>.*<\/li>)/gms, '<ul>$1</ul>');
      
      // Paragraphs
      const lines = html.split('\n').map(line => {
        line = line.trim();
        if (!line) return '';
        if (line.startsWith('<h') || line.startsWith('<ul') || line.startsWith('<li')) return line;
        return `<p>${line}</p>`;
      });

      return lines.join('');
    }

    // Open Info Modal
    async function openAppInfo(app, e) {
      e.preventDefault();
      e.stopPropagation();

      const title = app.title || app.name;
      modalTitle.textContent = title;
      modalIcon.src = `apps/${app.name}/icon.png`;
      modalIcon.onerror = function() { this.style.display = 'none'; };
      modalIcon.style.display = 'block';
      modalLaunchBtn.href = `apps/${app.name}/index.html`;

      modalBody.innerHTML = '<em>Loading app info...</em>';
      infoModal.classList.add('active');

      const rawMd = await loadAppReadme(app.name);
      modalBody.innerHTML = parseMarkdown(rawMd);
    }

    // Close Modal
    function closeModal() {
      infoModal.classList.remove('active');
    }

    closeModalBtn.addEventListener('click', closeModal);
    infoModal.addEventListener('click', (e) => {
      if (e.target === infoModal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Render cards
    function renderApps(apps) {
      appsGrid.innerHTML = '';

      if (apps.length === 0) {
        emptyState.style.display = 'block';
        return;
      } else {
        emptyState.style.display = 'none';
      }

      apps.forEach(app => {
        const card = document.createElement('a');
        card.className = 'app-card';
        card.href = `apps/${app.name}/index.html`;

        const iconPath = `apps/${app.name}/icon.png`;
        const title = app.title || app.name;
        const initial = app.name.charAt(0).toUpperCase();

        card.innerHTML = `
          <button class="info-btn" title="View app info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </button>
          <div class="icon-container">
            <img 
              src="${iconPath}" 
              alt="${title}" 
              class="icon-img"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />
            <div class="fallback-badge" style="display:none;">${initial}</div>
          </div>
          <div class="app-name">${title}</div>
        `;

        // Attach info button click handler
        const infoBtn = card.querySelector('.info-btn');
        infoBtn.addEventListener('click', (e) => openAppInfo(app, e));

        appsGrid.appendChild(card);
      });
    }

    // Initialize
    async function init() {
      renderApps(loadedApps);

      // Fetch external tags.txt for each app
      for (let app of loadedApps) {
        const fileTags = await loadAppTags(app.name);
        if (fileTags && fileTags.length > 0) {
          app.tags = Array.from(new Set([...(app.tags || []), ...fileTags]));
        }
      }

      // Discover extra folders from GitHub API if hosted on GitHub Pages
      try {
        const res = await fetch('https://api.github.com/repos/p1di/p1di.github.io/contents/apps');
        if (res.ok) {
          const items = await res.json();
          const dirs = items.filter(i => i.type === 'dir');
          
          for (let dir of dirs) {
            const existing = loadedApps.find(a => a.name.toLowerCase() === dir.name.toLowerCase());
            if (!existing) {
              const fileTags = await loadAppTags(dir.name);
              loadedApps.push({
                name: dir.name,
                title: dir.name.charAt(0).toUpperCase() + dir.name.slice(1),
                tags: fileTags || [dir.name]
              });
            }
          }
          renderApps(loadedApps);
        }
      } catch (e) {}
    }

    // Filter on search input across name, title, and tags
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderApps(loadedApps);
        return;
      }

      const filtered = loadedApps.filter(app => {
        const matchName = app.name.toLowerCase().includes(query);
        const matchTitle = app.title.toLowerCase().includes(query);
        const matchTags = (app.tags || []).some(tag => tag.toLowerCase().includes(query));
        return matchName || matchTitle || matchTags;
      });

      renderApps(filtered);
    });

    init();
  </script>
</body>
</html>
