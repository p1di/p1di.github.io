<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamed</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        .banner {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: #b91c1c;
            color: #ffffff;
            padding: 10px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Floating Transparent Back Arrow Overlay */
        .p1di-back-overlay {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(20, 20, 24, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            user-select: none;
        }

        .p1di-back-overlay:hover {
            background: rgba(35, 35, 42, 0.85);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
            transform: scale(1.05) translateX(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .p1di-back-arrow {
            font-size: 15px;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .p1di-back-overlay:hover .p1di-back-arrow {
            transform: translateX(-3px);
        }
    </style>
</head>

<body>
    <a href="../../" class="p1di-back-overlay" title="Back to p1di Hub">
        <span class="p1di-back-arrow">&larr;</span>
        <span>Apps</span>
    </a>
    <div id="banner" class="banner">
        Links failed, choose a new one here <a href="https://strmd.link" target="_blank"
            rel="noopener noreferrer">strmd.link</a>
    </div>
    <iframe id="stream-frame" allowfullscreen></iframe>
    <script>
        const frame = document.getElementById('stream-frame');
        const banner = document.getElementById('banner');
        async function checkUrl(url, timeoutMs = 3500) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                await fetch(url, { mode: 'no-cors', cache: 'no-cache', signal: controller.signal });
                clearTimeout(timer);
                return true;
            } catch (err) {
                clearTimeout(timer);
                return false;
            }
        }
        async function init() {
            // Try loading streamed.pk first
            if (await checkUrl('https://streamed.pk')) {
                frame.src = 'https://streamed.pk';
                return;
            }
            // Fallback to streamed.st if streamed.pk fails
            if (await checkUrl('https://streamed.st')) {
                frame.src = 'https://streamed.st';
                return;
            }
            // If both fail, show warning message and open strmd.link in iframe
            banner.style.display = 'block';
            frame.src = 'https://strmd.link';
        }
        init();
    </script>
</body>

</html>
